[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forensic-mcp"
version = "0.1.0"
description = "Read-only forensic MCP server with verifiable evidence security contract and provenance"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[project.scripts]
forensic-mcp = "forensic_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

